# Model tiers for the coordinating skill, for Claude and Codex alike.
#
# Agents read this when picking a model (SKILL.md section 2). The delegate and Orca
# model guards in hooks/ (optional, see SETUP.md) deny a launch whose model id is not
# listed under any `model:` key here, or that names no effort.
#
# Keep it plain block YAML: the guards read `model:` lines with grep, not a YAML parser.
# Ids: T3 `orchestrator_capabilities`, or `orca orchestration worker-start --help`.
#
# A family is used only if it is listed here AND its provider is active on the host. To work
# with one family only, delete the other family's blocks from every tier in your copy: the
# guards then deny its models, and the second opinion becomes a fresh same-family Heavy
# helper (SKILL.md section 2).
#
# Don't edit this copy: `npx skills update` overwrites it. Copy it to
# ~/.config/coordinating/models.yaml and edit that; agents and guards read it first.

tiers:
  light:
    use_for: XS work, summarising logs or CI, mechanical sweeps, re-checks, re-reviews
    claude:
      model: claude-haiku-5-5
      effort: high
    codex:
      model: gpt-6-luna
      effort: high

  mid: # the default
    use_for: S/M building, QA, tests, design-system work, routine review
    claude:
      model: claude-sonnet-5-5
      effort: medium
    codex:
      model: gpt-6.1-sol
      effort: medium

  heavy: # the ceiling
    use_for: coordinating, planning, strategy, advice, diagnosis, L building, review of Risky changes
    claude:
      model: claude-opus-5-5
      effort: high
    codex:
      model: gpt-6.1-sol
      effort: high

# A second opinion is the other family from the one coordinating, at Mid
# (Heavy when Risky), when that family is listed and active; otherwise a fresh
# same-family Heavy helper. Codex is also a good builder for backend or algorithmic S/M work.
second_opinion: other_family

# Ids the guards accept outside the tiers. Add entries as `- model: <id>`.
extra_allowed: []
